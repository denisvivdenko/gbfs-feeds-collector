[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "gbfs-feeds-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.67",
    "botocore[crt]>=1.43.67",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["stress: hits real GBFS provider endpoints to benchmark performance"]
addopts = "-m \"not stress\""
